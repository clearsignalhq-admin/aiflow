<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e22" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0e0e10;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0e10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="600" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#7c3aed"/>

  <!-- Logo hex + wordmark -->
  <text x="64" y="148" font-family="monospace" font-size="52" fill="#7c3aed">⬡</text>
  <text x="122" y="148" font-family="'Menlo','Consolas','Monaco',monospace" font-size="52" font-weight="800" fill="#e0e0e0">AiFlow</text>

  <!-- Tagline -->
  <text x="64" y="210" font-family="'Menlo','Consolas','Monaco',monospace" font-size="26" fill="#a78bfa">Visual AI Workflow Designer</text>

  <!-- Divider -->
  <rect x="64" y="238" width="480" height="1" fill="#2a2a2e"/>

  <!-- Description lines -->
  <text x="64" y="284" font-family="'Menlo','Consolas','Monaco',monospace" font-size="20" fill="#71717a">Describe a workflow in plain language.</text>
  <text x="64" y="316" font-family="'Menlo','Consolas','Monaco',monospace" font-size="20" fill="#71717a">AI generates a structured graph you can</text>
  <text x="64" y="348" font-family="'Menlo','Consolas','Monaco',monospace" font-size="20" fill="#71717a">edit, simulate, and evaluate.</text>

  <!-- Feature pills -->
  <rect x="64" y="390" width="110" height="34" rx="6" fill="#18181b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="119" y="413" font-family="monospace" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Generate</text>

  <rect x="188" y="390" width="110" height="34" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="243" y="413" font-family="monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="middle">Design</text>

  <rect x="312" y="390" width="110" height="34" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="367" y="413" font-family="monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="middle">Simulate</text>

  <rect x="436" y="390" width="110" height="34" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="491" y="413" font-family="monospace" font-size="14" font-weight="700" fill="#71717a" text-anchor="middle">Evaluate</text>

  <!-- Node types row -->
  <text x="64" y="480" font-family="monospace" font-size="13" fill="#52525b">Nodes:</text>
  <text x="130" y="480" font-family="monospace" font-size="13" fill="#7c6af7">LLM</text>
  <text x="172" y="480" font-family="monospace" font-size="13" fill="#52525b">·</text>
  <text x="184" y="480" font-family="monospace" font-size="13" fill="#f7a24a">TOOL</text>
  <text x="234" y="480" font-family="monospace" font-size="13" fill="#52525b">·</text>
  <text x="246" y="480" font-family="monospace" font-size="13" fill="#4af7c4">API</text>
  <text x="280" y="480" font-family="monospace" font-size="13" fill="#52525b">·</text>
  <text x="292" y="480" font-family="monospace" font-size="13" fill="#f74a8a">RAG</text>
  <text x="332" y="480" font-family="monospace" font-size="13" fill="#52525b">·</text>
  <text x="344" y="480" font-family="monospace" font-size="13" fill="#f7e24a">CONDITION</text>
  <text x="444" y="480" font-family="monospace" font-size="13" fill="#52525b">·</text>
  <text x="456" y="480" font-family="monospace" font-size="13" fill="#4a8af7">HITL</text>

  <!-- Right side: workflow diagram -->
  <!-- Edges -->
  <line x1="900" y1="170" x2="820" y2="260" stroke="#2a2a2e" stroke-width="2"/>
  <line x1="900" y1="170" x2="980" y2="260" stroke="#2a2a2e" stroke-width="2"/>
  <line x1="820" y1="300" x2="900" y2="380" stroke="#2a2a2e" stroke-width="2"/>
  <line x1="980" y1="300" x2="900" y2="380" stroke="#2a2a2e" stroke-width="2"/>
  <line x1="900" y1="420" x2="900" y2="490" stroke="#2a2a2e" stroke-width="2"/>

  <!-- START node -->
  <rect x="856" y="138" width="88" height="32" rx="16" fill="#18181b" stroke="#4af7c4" stroke-width="1.5"/>
  <text x="900" y="158" font-family="monospace" font-size="11" font-weight="700" fill="#4af7c4" text-anchor="middle">START</text>

  <!-- LLM node -->
  <rect x="776" y="262" width="88" height="32" rx="6" fill="#18181b" stroke="#7c6af7" stroke-width="1.5"/>
  <text x="820" y="282" font-family="monospace" font-size="11" font-weight="700" fill="#7c6af7" text-anchor="middle">LLM</text>

  <!-- CONDITION node -->
  <rect x="936" y="262" width="88" height="32" rx="6" fill="#18181b" stroke="#f7e24a" stroke-width="1.5"/>
  <text x="980" y="282" font-family="monospace" font-size="11" font-weight="700" fill="#f7e24a" text-anchor="middle">CONDITION</text>

  <!-- TOOL node -->
  <rect x="856" y="382" width="88" height="32" rx="6" fill="#18181b" stroke="#f7a24a" stroke-width="1.5"/>
  <text x="900" y="402" font-family="monospace" font-size="11" font-weight="700" fill="#f7a24a" text-anchor="middle">TOOL</text>

  <!-- END node -->
  <rect x="856" y="492" width="88" height="32" rx="16" fill="#18181b" stroke="#f74a8a" stroke-width="1.5"/>
  <text x="900" y="512" font-family="monospace" font-size="11" font-weight="700" fill="#f74a8a" text-anchor="middle">END</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#111113"/>
  <rect x="0" y="590" width="1200" height="1" fill="#2a2a2e"/>
  <text x="64" y="617" font-family="'Menlo','Consolas','Monaco',monospace" font-size="15" fill="#52525b">github.com/fuvito/aiflow</text>
  <text x="1136" y="617" font-family="'Menlo','Consolas','Monaco',monospace" font-size="15" fill="#52525b" text-anchor="end">by Fuat Yazar</text>
</svg>
